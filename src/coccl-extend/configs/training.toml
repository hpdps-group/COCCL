schema_version = 2

[runtime]
mode = "training"
compression_threshold_bytes = 8388608

[compressor_plugins]
compressors = ["sdp4bit", "tahquant"]
library_path = "../../../build/obj/coccl-extend/compressor_plugin/libcompress"

[pipeline]
depth = 4

[buffer]
pool_limit_bytes = 0
legacy_block_bytes = 0
physical_chunk_bytes = 8388608

[autotune]
enabled = true
profile_min_bytes = 262144
profile_max_bytes = 8589934592
warmup = 3
iterations = 10
reduce_scatter_algorithm = "auto"
all_reduce_algorithm = "auto"

[training]
observation_iterations = 10
max_events = 65536

[training.dp.all_gather]
compressor = "sdp4bit"

[training.dp.all_gather.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[training.dp.reduce_scatter]
compressor = "sdp4bit"

[training.dp.reduce_scatter.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[training.dp.reduce_scatter.config.hierarchical]
inQuantBits = 4
outQuantBits = 4
inGroupCount = 128
outGroupCount = 128
pipelineSize = 1

[training.dp.all_reduce]
compressor = "sdp4bit"

[training.dp.all_reduce.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[training.dp.all_reduce.config.hierarchical]
inQuantBits = 4
outQuantBits = 4
inGroupCount = 128
outGroupCount = 128
pipelineSize = 1

[training.tp.all_gather]
compressor = "sdp4bit"

[training.tp.all_gather.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[training.tp.reduce_scatter]
compressor = "sdp4bit"

[training.tp.reduce_scatter.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[training.tp.all_reduce]
compressor = "sdp4bit"

[training.tp.all_reduce.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[training.pp.sendrecv.forward]
compressor = "tahquant"

[training.pp.sendrecv.forward.config.default]
groupCount = 128
quantBits = 4
hadamard = false
pivotSwap = false
quantType = "Symmetric"

[training.pp.sendrecv.backward]
compressor = "tahquant"

[training.pp.sendrecv.backward.config.default]
groupCount = 128
quantBits = 4
hadamard = false
pivotSwap = false
quantType = "Symmetric"
