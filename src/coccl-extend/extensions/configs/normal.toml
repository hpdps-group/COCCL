schema_version = 2

[runtime]
mode = "normal"
compression_threshold_bytes = 8388608

[compressor_plugins]
compressors = ["sdp4bit", "tahquant"]
library_path = "../../../../build/obj/coccl-extend/compressor_plugin/libcompress"

[pipeline]
depth = 4

[buffer]
pool_limit_bytes = 0
legacy_block_bytes = 0
physical_chunk_bytes = 8388608

[autotune]
enabled = true
profile_min_bytes = 262144
profile_max_bytes = 8589934592
warmup = 3
iterations = 10
reduce_scatter_algorithm = "auto"
all_reduce_algorithm = "auto"

[normal.all_gather]
compressor = "tahquant"

[normal.all_gather.config.default]
groupCount = 128
quantBits = 4
hadamard = false
pivotSwap = false
quantType = "Symmetric"

[normal.reduce_scatter]
compressor = "sdp4bit"

[normal.reduce_scatter.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[normal.reduce_scatter.config.hierarchical]
inQuantBits = 4
outQuantBits = 4
inGroupCount = 128
outGroupCount = 128
pipelineSize = 1

[normal.all_reduce]
compressor = "sdp4bit"

[normal.all_reduce.config.default]
groupCount = 128
quantBits = 4
hadamard = false
quantType = "Symmetric"

[normal.all_reduce.config.hierarchical]
inQuantBits = 4
outQuantBits = 4
inGroupCount = 128
outGroupCount = 128
pipelineSize = 1

[normal.all_to_all]
compressor = "tahquant"

[normal.all_to_all.config.default]
groupCount = 128
quantBits = 4
hadamard = false
pivotSwap = false
quantType = "Symmetric"

[normal.sendrecv]
compressor = "tahquant"

[normal.sendrecv.config.default]
groupCount = 128
quantBits = 4
hadamard = false
pivotSwap = false
quantType = "Symmetric"
