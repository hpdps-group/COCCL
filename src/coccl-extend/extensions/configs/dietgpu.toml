schema_version = 2

[runtime]
mode = "normal"
compression_threshold_bytes = 8388608

[compressor_plugins]
compressors = ["dietgpu"]
library_path = "../../../../build/obj/coccl-extend/compressor_plugin/libcompress"

[pipeline]
depth = 4

[buffer]
pool_limit_bytes = 0
legacy_block_bytes = 0
physical_chunk_bytes = 8388608

[autotune]
enabled = false
profile_min_bytes = 262144
profile_max_bytes = 8589934592
warmup = 3
iterations = 10
reduce_scatter_algorithm = "auto"
all_reduce_algorithm = "auto"

[normal.all_gather]
compressor = "dietgpu"

[normal.all_gather.config.default]
probBits = 10

[normal.all_to_all]
compressor = "dietgpu"

[normal.all_to_all.config.default]
probBits = 10

[normal.reduce_scatter]
compressor = "dietgpu"

[normal.reduce_scatter.config.default]
probBits = 10

[normal.reduce_scatter.config.hierarchical]
probBits = 10

[normal.all_reduce]
compressor = "dietgpu"

[normal.all_reduce.config.default]
probBits = 10

[normal.all_reduce.config.hierarchical]
probBits = 10

[normal.sendrecv]
compressor = "dietgpu"

[normal.sendrecv.config.default]
probBits = 10
